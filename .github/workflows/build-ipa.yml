
name: Build TaneTane IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q tane-ios.zip
          ls -la
          ls -la tane-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: tane-ios
        run: xcodegen generate

      - name: Build app
        working-directory: tane-ios
        run: |
          xcodebuild \
            -project TaneTane.xcodeproj \
            -scheme TaneTane \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R tane-ios/build/Build/Products/Release-iphoneos/TaneTane.app Payload/
          zip -r TaneTane.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaneTane-ipa
          path: TaneTane.ipa
